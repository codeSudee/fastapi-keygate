[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-keygate"
version = "0.5.1"
description = "API-key auth, per-key rate limiting and usage tracking for FastAPI, in a few lines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Sudeepto" }]
keywords = ["fastapi", "api-key", "api-keys", "authentication", "rate-limiting", "rate-limit", "usage-tracking", "security", "middleware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100",
    "sqlalchemy>=2.0",
    "limits>=3.0",
]

[project.urls]
Homepage = "https://github.com/codeSudee/fastapi-keygate"
Issues = "https://github.com/codeSudee/fastapi-keygate/issues"
Changelog = "https://github.com/codeSudee/fastapi-keygate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
redis = ["redis>=4"]
postgres = ["psycopg[binary]>=3"]
async = ["sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.19"]
asyncpg = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.28"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "httpx>=0.24", "sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.19"]

[tool.hatch.build.targets.wheel]
packages = ["src/keygate"]
# The built dashboard UI is gitignored; hatchling skips ignored files unless listed here.
artifacts = ["src/keygate/dashboard_static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/keygate/dashboard_static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[project.scripts]
keygate = "keygate.cli:main"
