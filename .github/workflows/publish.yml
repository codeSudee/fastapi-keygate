name: Publish

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build dashboard UI
        run: cd dashboard && npm ci && npm run build
      - run: pip install build && python -m build
      - name: Check the wheel ships the dashboard UI
        run: |
          python - <<'PY'
          import glob, zipfile
          z = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          assert any(n.endswith("dashboard_static/index.html") for n in z.namelist()), "dashboard UI missing from wheel"
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
